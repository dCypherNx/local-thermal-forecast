name: Validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.13.2
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master


  publish-rc:
    if: github.ref == 'refs/heads/fix/local-observations-ui'
    needs: [lint-and-test, hacs, hassfest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish HACS release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.3-rc.6 >/dev/null 2>&1; then
            gh release create v0.3.3-rc.6 --target "$GITHUB_SHA" --title "Local Thermal Forecast v0.3.3-rc.6" --prerelease --notes "Release candidate with a raw baseline using the same per-horizon model selection as the corrected forecast."
          fi
